services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SQL_SA_PASSWORD}" -Q "SELECT 1" -b -No
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    networks:
      - factory-net
  unscribe:
    image: ghcr.io/openfactorylabusine/unscribe:latest
    container_name: unscribe
    environment:
      - SERVER=sqlserver
      - DATABASE=labusine_db
      - USER=sa
      - PASSWORD=${SQL_SA_PASSWORD}
    ports:
      - "5555:5555"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - factory-net
    stdin_open: true
    tty: true
    restart: unless-stopped
volumes:
  sqlserver_data:

networks:
  factory-net:
    name: factory-net
    external: true