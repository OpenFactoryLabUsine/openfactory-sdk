# CONFIGURATION POUR LA METHODE CSV AVEC SCRIPT BASH
[[inputs.file]]
  files = ["/tmp/influx_raw.csv"]
  data_format = "csv"
  csv_header_row_count = 1
  
  csv_column_names = ["time", "ASSET_UUID", "ID", "TAG", "TYPE", "VALUE"]
  csv_column_types = ["string", "string", "string", "string", "string", "string"]
  csv_tag_columns = ["ASSET_UUID", "ID", "TAG", "TYPE"]

  csv_timestamp_column = "time"
  csv_timestamp_format = "2006-01-02T15:04:05.999999999"


  csv_measurement_column = "cnc_data"

