[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 10000
  metric_buffer_limit = 2500000
  flush_interval = "1s"
  flush_jitter = "0s"
  omit_hostname = true
  buffer_strategy = "memory"


